name: Training JSON preflight
on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/audit_training_records.py'
      - 'tests/test_audit_training_records.py'
      - 'data/training/*.json'
      - '.github/workflows/training-json-preflight.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run isolated unit tests
        run: python -m unittest discover -s tests -p 'test_audit_training_records.py' -v
      - name: Audit bundled training records
        run: python tools/audit_training_records.py --json
