name: Test ModernLLM regressions

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install CPU PyTorch
        run: python -m pip install --index-url https://download.pytorch.org/whl/cpu 'torch>=2.1'

      - name: Compile ModernLLM sources
        run: python -m compileall -q modern_llm train.py train_h100.py tests/test_modern_llm_regressions.py

      - name: Run focused regression tests
        run: python -m unittest -v tests.test_modern_llm_regressions
