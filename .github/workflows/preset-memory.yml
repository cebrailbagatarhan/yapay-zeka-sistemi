name: Preset memory estimator
on:
  pull_request:
    paths:
      - 'tools/preset_memory.py'
      - 'tests/test_preset_memory.py'
      - '.github/workflows/preset-memory.yml'
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m unittest discover -s tests -p 'test_preset_memory.py' -v
      - run: python -m tools.preset_memory --preset nano --json
